services:
  - type: web
    name: gitlab-ai-chatbot
    runtime: python
    region: oregon               # or frankfurt / singapore / ohio
    plan: free                   # change to starter later if you want no sleep

    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt

      # Install Node 20
      export NVM_DIR="$HOME/.nvm"
      [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
      nvm install 20
      nvm use 20

      # Build frontend
      cd gitlab-insight-bot-main
      npm install --legacy-peer-deps
      npm run build
      cd ..

    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT --workers 1

    healthCheckPath: /health

    envVars:
      - key: GOOGLE_API_KEY
        sync: false

      - key: PINECONE_API_KEY
        sync: false

      - key: PINECONE_INDEX_NAME
        value: gitlab-chatbot

      - key: PYTHON_VERSION
        value: "3.10.12"